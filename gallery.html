<div class="lightbox-overlay" id="lightbox">

    <div class="lightbox-content-wrapper">

<script>
    // --- 1. Анімація появи карток ---
    const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                obs.unobserve(entry.target);
            }
        });
    }, { threshold: 0.1 });
    document.querySelectorAll('.gallery-item').forEach(item => observer.observe(item));

    // --- 2. Логіка Оверлею та Галереї Проєкту ---
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.getElementById('lightbox-close');
    const prevBtn = document.getElementById('prev-arrow');
    const nextBtn = document.getElementById('next-arrow');

    let currentProjectImages = [];
    let currentIndex = 0;

    // Відкриття оверлею
    document.querySelectorAll('.gallery-item').forEach(item => {
        item.addEventListener('click', () => {
            const imagesAttr = item.getAttribute('data-project-images');
            
            if (imagesAttr) {
                currentProjectImages = imagesAttr.split(',');
            } else {
                currentProjectImages = [item.querySelector('.gallery-img').src];
            }
            
            currentIndex = 0;
            updateLightbox();
            
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        });
    });

    function updateLightbox() {
        lightboxImg.src = currentProjectImages[currentIndex];
        
        if (currentProjectImages.length <= 1) {
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
        } else {
            prevBtn.style.display = 'block';
            nextBtn.style.display = 'block';
        }
    }

    function nextImage(e) {
        if (e) e.stopPropagation();
        currentIndex++;
        if (currentIndex >= currentProjectImages.length) currentIndex = 0;
        updateLightbox();
    }

    function prevImage(e) {
        if (e) e.stopPropagation();
        currentIndex--;
        if (currentIndex < 0) currentIndex = currentProjectImages.length - 1;
        updateLightbox();
    }

    nextBtn.addEventListener('click', nextImage);
    prevBtn.addEventListener('click', prevImage);

    function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
        setTimeout(() => { if(!lightbox.classList.contains('active')) lightboxImg.src = ''; }, 300);
    }

    closeBtn.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox || e.target.classList.contains('lightbox-content-wrapper')) {
            closeLightbox();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('active')) return;
        
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight' && currentProjectImages.length > 1) nextImage();
        if (e.key === 'ArrowLeft' && currentProjectImages.length > 1) prevImage();
    });
</script>

<script>
  var form = document.getElementById("my-form");
  
  async function handleSubmit(event) {
    event.preventDefault();
    var status = document.getElementById("my-form-status");
    var data = new FormData(event.target);
    fetch(event.target.action, {
      method: form.method,
      body: data,
      headers: {
          'Accept': 'application/json'
      }
    }).then(response => {
      if (response.ok) {
        status.innerHTML = "Thanks for your submission!";
        form.reset()
      } else {
        response.json().then(data => {
          if (Object.hasOwn(data, 'errors')) {
            status.innerHTML = data["errors"].map(error => error["message"]).join(", ")
          } else {
            status.innerHTML = "Oops! There was a problem submitting your form"
          }
        })
      }
    }).catch(error => {
      status.innerHTML = "Oops! There was a problem submitting your form"
    });
  }
  form.addEventListener("submit", handleSubmit)
</script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
  var observerOptions = {
    root: null,
    rootMargin: "0px",
    threshold: 0.1
  };

  var observer = new IntersectionObserver(function(entries, observer) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        var children = entry.target.children;
        for (let i = 0; i < children.length; i++) {
          setTimeout(function() {
            children[i].classList.add("visible");
          }, i * 300); // Затримка 300 мс між кожним рядком
        }
        observer.unobserve(entry.target); // Зупиняємо спостереження після появи
      }
    });
  }, observerOptions);

  var slogans = document.querySelectorAll(".slogan");
  slogans.forEach(function(slogan) {
    observer.observe(slogan);
  });
});
</script>
